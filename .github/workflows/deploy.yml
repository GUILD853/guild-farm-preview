name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # GitHub の Actions 画面から手動実行したいとき用
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # 2026-11-10 独自ドメイン https://ehimefarm.guild853.com に切り替えた。
      # ルート配信になったので NEXT_PUBLIC_BASE_PATH（/guild-farm-preview）は外した。
      # DNSは Xserver に CNAME ehimefarm → guild853.github.io を置いている。
      - name: Build (static export)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://ehimefarm.guild853.com

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
